[project]
name = "fuse-energy-homeassistant"
version = "0.4.6"
description = "Home Assistant custom integration for Fuse Energy (UK)."
requires-python = ">=3.13"
dependencies = []
authors = [
	{name = "Simon Solts", email = "simonsolts@users.noreply.github.com"}
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/simonsolts/fuse-homeassistant"
Repository = "https://github.com/simonsolts/fuse-homeassistant"

[tool.uv]
environments = ["python_version >= '3.13'"]

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
]
lint = [
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
