[project]
name = "fuse-energy-homeassistant"
version = "0.0.1"
description = "Home Assistant custom integration for Fuse Energy (UK)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
