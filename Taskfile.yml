# https://taskfile.dev
version: "3"

tasks:
  default:
    desc: Run linting and tests
    cmds:
      - task: lint
      - task: test

  install:
    desc: Sync all dependency groups
    cmds:
      - uv sync --all-groups

  test:
    desc: Run the test suite
    cmds:
      - uv run --group test pytest {{.CLI_ARGS}}

  lint:
    desc: Run ruff lint and format checks (no changes)
    cmds:
      - uv run --group lint ruff check .
      - uv run --group lint ruff format --check .

  lint:fix:
    desc: Auto-fix lint issues and format the code
    cmds:
      - uv run --group lint ruff check --fix .
      - uv run --group lint ruff format .

  format:
    desc: Format the code with ruff
    cmds:
      - uv run --group lint ruff format .

  bump-version:
    desc: Bump the patch version in pyproject.toml & manifest.json, then relock uv
    cmds:
      - |
        uv run python - <<'PY'
        import pathlib
        import re

        pyproject = pathlib.Path("pyproject.toml")
        manifest = pathlib.Path("custom_components/fuse_energy/manifest.json")

        text = pyproject.read_text()
        match = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', text, re.M)
        if match is None:
            raise SystemExit("Could not find version in pyproject.toml")
        major, minor, patch = (int(part) for part in match.groups())
        old = f"{major}.{minor}.{patch}"
        new = f"{major}.{minor}.{patch + 1}"

        pyproject.write_text(text.replace(f'version = "{old}"', f'version = "{new}"', 1))
        manifest.write_text(
            manifest.read_text().replace(f'"version": "{old}"', f'"version": "{new}"', 1)
        )
        print(f"Bumped version {old} -> {new}")
        PY
      - uv lock
